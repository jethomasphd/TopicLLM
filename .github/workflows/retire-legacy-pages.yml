name: Redirect legacy GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Create redirect-only legacy site
        run: |
          mkdir legacy
          cat > legacy/index.html <<'HTML'
          <!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TopicLLM has moved</title><link rel="canonical" href="https://topicllm.dev/"><h1>TopicLLM is at topicllm.dev</h1><p><a href="https://topicllm.dev/">Continue to the research platform</a>.</p><script>location.replace('https://topicllm.dev'+(location.pathname.replace(/^\/TopicLLM/,'')||'/')+location.search+location.hash);</script></html>
          HTML
          cp legacy/index.html legacy/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: legacy
      - name: Publish redirect
        id: deployment
        uses: actions/deploy-pages@v4
