name: Research and source integrity checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev]"
      - run: python -m pytest dtm_pipeline/tests -q
      - run: python scripts/build-study-demo.py && git diff --exit-code docs/data/study-demo.json
      - run: python -m build --wheel --outdir dist_wheels
      - run: python scripts/package-release.py
      - run: node scripts/build.mjs
      - run: node scripts/check-site.mjs
  installed-package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build --wheel --outdir dist_wheels
      - run: python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install',*glob.glob('dist_wheels/*.whl')])"
      - run: python -m dtm_pipeline --profile quickcheck --output-dir topicllm-installed-check
        working-directory: ${{ runner.temp }}
