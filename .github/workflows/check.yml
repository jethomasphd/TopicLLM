name: Research and source integrity checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/*.test.mjs
      - run: node scripts/build.mjs
      - run: node scripts/check-site.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pandas statsmodels
      - run: python -m pytest dtm_pipeline/tests -q
      - run: python scripts/build-study-demo.py && git diff --exit-code docs/data/study-demo.json
