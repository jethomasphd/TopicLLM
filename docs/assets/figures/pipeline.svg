<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 196" width="960" height="196" role="img" aria-labelledby="t d" font-family="&#x27;IBM Plex Sans&#x27;, &#x27;Helvetica Neue&#x27;, Arial, sans-serif"><title id="t">The TopicLLM workflow</title><desc id="d">Five stages: discover, name, define, check, report. People decide at define and check.</desc><style>.f-ink{fill:#0f2436}.s-ink{stroke:#0f2436}.f-ink2{fill:#3b4f60}.s-ink2{stroke:#3b4f60}.f-muted{fill:#6b7c89}.s-muted{stroke:#6b7c89}.f-rule{fill:#e3e8ec}.s-rule{stroke:#e3e8ec}.f-accent{fill:#0f8a6c}.s-accent{stroke:#0f8a6c}.f-accentsoft{fill:#d5eee5}.s-accentsoft{stroke:#d5eee5}.f-grey{fill:#9aa8b2}.s-grey{stroke:#9aa8b2}.f-greysoft{fill:#e9edf0}.s-greysoft{stroke:#e9edf0}.f-amber{fill:#b45309}.s-amber{stroke:#b45309}.f-ambersoft{fill:#fbecd9}.s-ambersoft{stroke:#fbecd9}.f-bg{fill:#ffffff}.s-bg{stroke:#ffffff}@media (prefers-color-scheme: dark){.f-ink{fill:#ebf2f4}.s-ink{stroke:#ebf2f4}.f-ink2{fill:#c3d2da}.s-ink2{stroke:#c3d2da}.f-muted{fill:#93a7b2}.s-muted{stroke:#93a7b2}.f-rule{fill:#26363f}.s-rule{stroke:#26363f}.f-accent{fill:#5fd3ad}.s-accent{stroke:#5fd3ad}.f-accentsoft{fill:#173d33}.s-accentsoft{stroke:#173d33}.f-grey{fill:#6f828d}.s-grey{stroke:#6f828d}.f-greysoft{fill:#1d2b33}.s-greysoft{stroke:#1d2b33}.f-amber{fill:#f0a14a}.s-amber{stroke:#f0a14a}.f-ambersoft{fill:#3a2a14}.s-ambersoft{stroke:#3a2a14}.f-bg{fill:#0d171e}.s-bg{stroke:#0d171e}}text{font-family:'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif}</style><rect x="2.0" y="38.0" width="168.0" height="112.0" rx="10" fill="#ffffff" stroke="#e3e8ec" class="f-bg s-rule" stroke-width="1.5"/><text x="20.0" y="70.0" font-size="12" font-weight="500" text-anchor="start" fill="#6b7c89" class="f-muted" >01</text><text x="20.0" y="96.0" font-size="19" font-weight="600" text-anchor="start" fill="#0f2436" class="f-ink" >Discover</text><text x="20.0" y="120.0" font-size="13" font-weight="400" text-anchor="start" fill="#3b4f60" class="f-ink2" >A topic model groups</text><text x="20.0" y="137.0" font-size="13" font-weight="400" text-anchor="start" fill="#3b4f60" class="f-ink2" >similar posts</text><line x1="176.0" y1="94.0" x2="194.0" y2="94.0" stroke="#9aa8b2" class="s-grey" stroke-width="1.5"/><path d="M194.0,89 l7,5 l-7,5z" fill="#9aa8b2" class="f-grey"/><rect x="200.0" y="38.0" width="168.0" height="112.0" rx="10" fill="#ffffff" stroke="#e3e8ec" class="f-bg s-rule" stroke-width="1.5"/><text x="218.0" y="70.0" font-size="12" font-weight="500" text-anchor="start" fill="#6b7c89" class="f-muted" >02</text><text x="218.0" y="96.0" font-size="19" font-weight="600" text-anchor="start" fill="#0f2436" class="f-ink" >Name</text><text x="218.0" y="120.0" font-size="13" font-weight="400" text-anchor="start" fill="#3b4f60" class="f-ink2" >An LLM proposes a name</text><text x="218.0" y="137.0" font-size="13" font-weight="400" text-anchor="start" fill="#3b4f60" class="f-ink2" >500 times per topic</text><line x1="374.0" y1="94.0" x2="392.0" y2="94.0" stroke="#9aa8b2" class="s-grey" stroke-width="1.5"/><path d="M392.0,89 l7,5 l-7,5z" fill="#9aa8b2" class="f-grey"/><rect x="398.0" y="38.0" width="168.0" height="112.0" rx="10" fill="#ffffff" stroke="#b45309" class="f-bg s-amber" stroke-width="1.5"/><text x="416.0" y="70.0" font-size="12" font-weight="500" text-anchor="start" fill="#6b7c89" class="f-muted" >03</text><text x="416.0" y="96.0" font-size="19" font-weight="600" text-anchor="start" fill="#0f2436" class="f-ink" >Define</text><text x="416.0" y="120.0" font-size="13" font-weight="400" text-anchor="start" fill="#3b4f60" class="f-ink2" >Two people write</text><text x="416.0" y="137.0" font-size="13" font-weight="400" text-anchor="start" fill="#3b4f60" class="f-ink2" >the codebook</text><text x="482.0" y="178.0" font-size="12" font-weight="600" text-anchor="middle" fill="#b45309" class="f-amber" >A person decides</text><line x1="572.0" y1="94.0" x2="590.0" y2="94.0" stroke="#9aa8b2" class="s-grey" stroke-width="1.5"/><path d="M590.0,89 l7,5 l-7,5z" fill="#9aa8b2" class="f-grey"/><rect x="596.0" y="38.0" width="168.0" height="112.0" rx="10" fill="#ffffff" stroke="#b45309" class="f-bg s-amber" stroke-width="1.5"/><text x="614.0" y="70.0" font-size="12" font-weight="500" text-anchor="start" fill="#6b7c89" class="f-muted" >04</text><text x="614.0" y="96.0" font-size="19" font-weight="600" text-anchor="start" fill="#0f2436" class="f-ink" >Check</text><text x="614.0" y="120.0" font-size="13" font-weight="400" text-anchor="start" fill="#3b4f60" class="f-ink2" >Classifier vs. two</text><text x="614.0" y="137.0" font-size="13" font-weight="400" text-anchor="start" fill="#3b4f60" class="f-ink2" >human coders</text><text x="680.0" y="178.0" font-size="12" font-weight="600" text-anchor="middle" fill="#b45309" class="f-amber" >A person decides</text><line x1="770.0" y1="94.0" x2="788.0" y2="94.0" stroke="#9aa8b2" class="s-grey" stroke-width="1.5"/><path d="M788.0,89 l7,5 l-7,5z" fill="#9aa8b2" class="f-grey"/><rect x="794.0" y="38.0" width="168.0" height="112.0" rx="10" fill="#ffffff" stroke="#e3e8ec" class="f-bg s-rule" stroke-width="1.5"/><text x="812.0" y="70.0" font-size="12" font-weight="500" text-anchor="start" fill="#6b7c89" class="f-muted" >05</text><text x="812.0" y="96.0" font-size="19" font-weight="600" text-anchor="start" fill="#0f2436" class="f-ink" >Report</text><text x="812.0" y="120.0" font-size="13" font-weight="400" text-anchor="start" fill="#3b4f60" class="f-ink2" >Theme shares with</text><text x="812.0" y="137.0" font-size="13" font-weight="400" text-anchor="start" fill="#3b4f60" class="f-ink2" >their uncertainty</text><text x="2.0" y="18.0" font-size="13" font-weight="400" text-anchor="start" fill="#6b7c89" class="f-muted" >Machines compute. People decide what it means and whether to believe it.</text></svg>
