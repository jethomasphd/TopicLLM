0.0" y="46.0" width="215.0" height="36.0" rx="6" fill="#0f8a6c" class="f-accent"/><text x="507.0" y="71.0" font-size="19" font-weight="700" text-anchor="start" fill="#0f8a6c" class="f-accent" >16%</text><text x="264.0" y="129.0" font-size="15" font-weight="500" text-anchor="end" fill="#0f2436" class="f-ink" >Classifier · the same 250 posts</text><rect x="280.0" y="104.0" width="590.0" height="36.0" rx="6" fill="#e9edf0" class="f-greysoft"/><rect x="280.0" y="104.0" width="451.0" height="36.0" rx="6" fill="#b45309" class="f-amber"/><text x="743.0" y="129.0" font-size="19" font-weight="700" text-anchor="start" fill="#b45309" class="f-amber" >34%</text><text x="264.0" y="187.0" font-size="15" font-weight="500" text-anchor="end" fill="#0f2436" class="f-ink" >Classifier · all 26,239 posts</text><rect x="280.0" y="162.0" width="590.0" height="36.0" rx="6" fill="#e9edf0" class="f-greysoft"/><rect x="280.0" y="162.0" width="521.2" height="36.0" rx="6" fill="#9aa8b2" class="f-grey"/><text x="813.2" y="187.0" font-size="19" font-weight="700" text-anchor="start" fill="#3b4f60" class="f-ink2" >40%</text><text x="280.0" y="240.0" font-size="12" font-weight="400" text-anchor="start" fill="#6b7c89" class="f-muted" >Human coders and classifier on one random sample of first-term posts; grey: the classifier on every post.</text></svg>
