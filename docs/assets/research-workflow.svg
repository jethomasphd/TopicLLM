<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="388" viewBox="0 0 1200 388" role="img" aria-labelledby="title desc">
<title id="title">TopicLLM: five stages with explicit researcher decisions</title><desc id="desc">Discover topics, collect naming votes, pause for two researchers to approve themes, validate classification on an independent benchmark, then estimate prevalence. Each stage retains evidence. Agents execute the protocol and prepare review packets; researchers own scientific decisions.</desc>
<rect width="1200" height="388" rx="18" fill="#0a151c"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="40" y="43" fill="#99e5c8" font-size="11" letter-spacing="2">THE RESEARCH CONTRACT</text><text x="40" y="83" fill="#edf5f7" font-size="29">A method your agent can follow. Decisions you can defend.</text>
<g fill="none" stroke="#57717f" stroke-width="1.5"><path d="M230 185h35m-6-5 6 5-6 5M460 185h35m-6-5 6 5-6 5M690 185h35m-6-5 6 5-6 5M920 185h35m-6-5 6 5-6 5"/></g>
<g fill="#132630" stroke="#36505c"><rect x="40" y="118" width="190" height="133" rx="8"/><rect x="270" y="118" width="190" height="133" rx="8"/><rect x="730" y="118" width="190" height="133" rx="8"/><rect x="960" y="118" width="200" height="133" rx="8"/></g><rect x="500" y="118" width="190" height="133" rx="8" fill="#25372f" stroke="#d7b477" stroke-width="1.5"/>
<g font-size="10" letter-spacing="1.3" fill="#a7bdc8"><text x="58" y="143">01 / COMPUTATION</text><text x="288" y="143">02 / LLM VOTES</text><text x="518" y="143" fill="#eed09e">03 / HUMAN REVIEW</text><text x="748" y="143">04 / VALIDATION GATE</text><text x="978" y="143">05 / STATISTICS</text></g>
<g font-size="24" fill="#eef5f6"><text x="58" y="184">Discover</text><text x="288" y="184">Name</text><text x="518" y="184">Synthesize</text><text x="748" y="184">Classify</text><text x="978" y="184">Estimate</text></g>
<g font-size="13" fill="#b6c9d1"><text x="58" y="214">Search for structure.</text><text x="58" y="233">Retain the fitted model.</text><text x="288" y="214">Collect independent votes.</text><text x="288" y="233">Keep disagreement visible.</text><text x="518" y="214" fill="#e7deca">Two researchers interpret</text><text x="518" y="233" fill="#e7deca">and approve the themes.</text><text x="748" y="214">Independent benchmark.</text><text x="748" y="233">Pass before corpus scaling.</text><text x="978" y="214">Counts and denominators.</text><text x="978" y="233">Prevalence and comparisons.</text></g>
<g font-family="monospace" font-size="11" fill="#93b7aa"><text x="58" y="278">candidates + provenance</text><text x="288" y="278">ballots + usage</text><text x="518" y="278">map + review record</text><text x="748" y="278">benchmark + labels</text><text x="978" y="278">counts + tests</text></g><path d="M40 305h1120" stroke="#30434d"/><text x="40" y="341" fill="#9ab2be" font-size="13">Researchers also define the corpus, annotate the benchmark and interpret results.</text><text x="1160" y="341" text-anchor="end" fill="#99e5c8" font-size="12">Every stage leaves evidence.</text></g></svg>
