[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topicllm-research"
version = "0.6.1"
description = "Auditable topic interpretation and prevalence workflows for research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSE-CONTENT.md"]
authors = [{name = "Jacob E. Thomas"}]
dependencies = ["pandas>=2.0", "numpy>=1.24", "statsmodels>=0.14", "openai>=1.0"]

[project.optional-dependencies]
ml = ["bertopic>=0.16", "sentence-transformers>=2.2", "umap-learn>=0.5", "hdbscan>=0.8", "gensim>=4.3", "nltk>=3.8", "scikit-learn>=1.3", "matplotlib>=3.7", "tqdm>=4.66"]
dev = ["pytest>=8", "build>=1", "wheel"]

[project.scripts]
topicllm = "dtm_pipeline.run_pipeline:main"
topicllm-annotations = "dtm_pipeline.annotation_cli:main"
topicllm-import-synthesis = "dtm_pipeline.synthesis_review:main"
topicllm-select-candidate = "dtm_pipeline.selection:main"

[project.urls]
Repository = "https://github.com/jethomasphd/TopicLLM"
Documentation = "https://topicllm.dev/reproduce/"

[tool.setuptools]
packages = ["dtm_pipeline"]

[tool.setuptools.package-data]
dtm_pipeline = ["data/trump/*", "annotation_ui.html", "synthesis_ui.html", "synthesis_logic.js", "adjudication_ui.html"]
